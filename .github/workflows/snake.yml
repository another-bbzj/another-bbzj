name: snake

on:
  schedule:
    - cron: "0 16 * * *"   # 每天 00:00 (UTC+8)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#d9774b&color_dots=#211e1b,#3a332c,#6b5546,#a8643f,#d9774b
            dist/snake-light.svg?color_snake=#b4552c&color_dots=#ebe4d8,#d8c7b3,#c9a07f,#c27a52,#b4552c

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
